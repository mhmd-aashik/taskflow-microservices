apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: taskflow

spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification
          image: taskflow-notification-service:local
          imagePullPolicy: Never

          envFrom:
            - secretRef:
                name: notification-service-credentials

          env:
            - name: NODE_ENV
              value: "production"
            - name: RABBITMQ_QUEUE
              value: "taskflow.notifications"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
