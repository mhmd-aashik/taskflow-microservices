apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-service
  namespace: taskflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway-service

  template:
    metadata:
      labels:
        app: gateway-service

    spec:
      containers:
        - name: gateway
          image: taskflow-gateway-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

            # - name: RABBITMQ_URL
            #   value: "amqp://taskflow:taskflow-dev-123@rabbitmq:5672"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-rabbitmq
                  key: RABBITMQ_URL

            - name: RABBITMQ_TASK_QUEUE
              value: "taskflow.tasks"

            - name: RABBITMQ_AUTH_QUEUE
              value: "taskflow.auth"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
