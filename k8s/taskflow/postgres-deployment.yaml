apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: taskflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: "taskflow"
            - name: POSTGRES_PASSWORD
              value: "taskflow-dev-123"
            - name: POSTGRES_DB
              value: "taskflow_auth"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
