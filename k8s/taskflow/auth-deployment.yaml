apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: taskflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth
          image: taskflow-auth-service:local
          imagePullPolicy: Never

          envFrom:
            - secretRef:
                name: auth-service-credentials

          env:
            - name: NODE_ENV
              value: "production"
            - name: RABBITMQ_QUEUE
              value: "taskflow.auth"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
