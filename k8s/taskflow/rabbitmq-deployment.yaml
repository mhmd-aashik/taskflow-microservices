apiVersion: apps/v1
kind: Deployment

metadata:
  name: rabbitmq
  namespace: taskflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management

          envFrom:
            - secretRef:
                name: rabbitmq-credentials
          ports:
            - containerPort: 5672
            - containerPort: 15672

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
