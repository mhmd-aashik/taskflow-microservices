apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-service
  namespace: taskflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-service

  template:
    metadata:
      labels:
        app: task-service

    spec:
      containers:
        - name: task
          image: taskflow-task-service:local
          imagePullPolicy: Never

          envFrom:
            - secretRef:
                name: task-service-credentials

          env:
            - name: NODE_ENV
              value: "production"

            - name: RABBITMQ_QUEUE
              value: "taskflow.tasks"

            - name: RABBITMQ_NOTIFICATION_QUEUE
              value: "taskflow.notifications"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
